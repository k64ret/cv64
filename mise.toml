[settings]
lockfile = true

[tools]
cmake = "3"
"github:clangd/clangd" = "latest"
"github:simonlindholm/asm-processor" = "latest"
make = "latest"
ninja = "latest"
python = "latest"
"pipx:splat64" = { version = "latest", extras = "mips" }
usage = "latest"

[task_config]
includes = ['scripts']

[tasks.m2ctx]
description = 'Create a context file which can be used for m2c / decomp.me'
usage = '''
arg "<c_file>" help="File from which to create context"
'''
run = 'python tools/m2ctx.py {{arg(name="c_file")}}'
alias = 'ctx'

[tasks.build]
description = 'Build Castlevania ROM'
run = "cmake --build build"
alias = 'b'
